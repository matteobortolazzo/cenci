<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Cenci routes live session status</title>
  <desc id="desc">Claude Code and Codex hooks push session state to cenci, which updates tmux and optional desktop status surfaces.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#111b35"/></linearGradient></defs>
  <rect width="1200" height="480" rx="24" fill="url(#bg)"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="50" y="63" font-size="30" font-weight="750" fill="#f8fafc">See every session without babysitting every terminal.</text>
    <text x="50" y="94" font-size="16" fill="#a8b3cf">Hooks push state changes instantly. Cenci routes attention to the surfaces you already use.</text>

    <rect x="50" y="142" width="220" height="196" rx="18" fill="#111a2d" stroke="#2b3b60"/>
    <text x="76" y="178" font-size="12" font-weight="700" fill="#8292b6" letter-spacing="1.4">AGENT HOOKS</text>
    <rect x="76" y="199" width="168" height="48" rx="12" fill="#17243d"/>
    <circle cx="99" cy="223" r="7" fill="#d97757"/>
    <text x="117" y="228" font-size="16" font-weight="650" fill="#e9eefc">Claude Code</text>
    <rect x="76" y="261" width="168" height="48" rx="12" fill="#17243d"/>
    <circle cx="99" cy="285" r="7" fill="#55d6be"/>
    <text x="117" y="290" font-size="16" font-weight="650" fill="#e9eefc">Codex</text>

    <path d="M282 240h111" stroke="#536487" stroke-width="2" stroke-dasharray="5 6"/><path d="M385 232l8 8-8 8" fill="none" stroke="#536487" stroke-width="2"/>
    <text x="302" y="223" font-size="12" fill="#7180a1">events</text>

    <rect x="405" y="166" width="270" height="148" rx="24" fill="#19142f" stroke="#7650c7" stroke-width="2"/>
    <circle cx="455" cy="216" r="24" fill="#302352"/>
    <path d="M443 220h6l5-12 7 21 5-9h7" fill="none" stroke="#c4a7ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="493" y="213" font-size="21" font-weight="750" fill="#f8fafc">Cenci</text>
    <text x="493" y="237" font-size="13" fill="#bba8dd">session-keyed daemon</text>
    <rect x="435" y="263" width="210" height="28" rx="14" fill="#241b3e"/>
    <text x="463" y="282" font-size="12" font-weight="650" fill="#d5c4ff">push updates · stale sweep</text>

    <path d="M687 240h106" stroke="#536487" stroke-width="2"/><path d="M785 232l8 8-8 8" fill="none" stroke="#536487" stroke-width="2"/>
    <text x="705" y="223" font-size="12" fill="#7180a1">live state</text>

    <rect x="805" y="128" width="345" height="224" rx="18" fill="#111a2d" stroke="#2b3b60"/>
    <text x="831" y="164" font-size="12" font-weight="700" fill="#8292b6" letter-spacing="1.4">STATUS SURFACES</text>
    <rect x="831" y="185" width="293" height="42" rx="10" fill="#17243d"/>
    <text x="853" y="211" font-size="14" font-weight="650" fill="#d8e2ff">tmux</text>
    <rect x="923" y="193" width="83" height="26" rx="6" fill="#102e48"/><circle cx="939" cy="206" r="4" fill="#38bdf8"/><text x="950" y="211" font-size="12" fill="#bae6fd">▶ api</text>
    <rect x="831" y="239" width="293" height="42" rx="10" fill="#17243d"/>
    <text x="853" y="265" font-size="14" font-weight="650" fill="#d8e2ff">desktop bars</text>
    <text x="991" y="265" font-size="12" fill="#8292b6">Linux</text>
    <rect x="831" y="293" width="293" height="42" rx="10" fill="#17243d"/>
    <text x="853" y="319" font-size="14" font-weight="650" fill="#d8e2ff">menu bar</text>
    <text x="987" y="319" font-size="12" fill="#8292b6">macOS</text>

    <rect x="50" y="384" width="1100" height="54" rx="15" fill="#0d1528" stroke="#243454"/>
    <g font-size="13" font-weight="650">
      <circle cx="79" cy="411" r="5" fill="#38bdf8"/><text x="94" y="416" fill="#bae6fd">running</text>
      <circle cx="209" cy="411" r="5" fill="#4ade80"/><text x="224" y="416" fill="#bbf7d0">done</text>
      <circle cx="317" cy="411" r="5" fill="#fb7185"/><text x="332" y="416" fill="#fecdd3">needs input</text>
      <circle cx="475" cy="411" r="5" fill="#64748b"/><text x="490" y="416" fill="#cbd5e1">idle</text>
    </g>
    <text x="773" y="416" font-size="13" fill="#7180a1">tmux · Waybar · Noctalia · DMS · GNOME · Plasma · SwiftBar</text>
  </g>
</svg>
