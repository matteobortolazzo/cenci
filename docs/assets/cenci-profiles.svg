<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Choose how far cenci should go</title>
  <desc id="desc">Four cumulative profiles: observe agents with Watch, add Sandbox isolation, add Flow for ticket-to-PR delivery, then explicitly enable dispatch and automerge for the full loop.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#111b35"/></linearGradient>
    <linearGradient id="active" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#6d28d9"/><stop offset="1" stop-color="#9333ea"/></linearGradient>
  </defs>
  <rect width="1200" height="500" rx="24" fill="url(#bg)"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="50" y="62" font-size="30" font-weight="750" fill="#f8fafc">Start with the outcome you need. Add the next layer when it earns its place.</text>
    <text x="50" y="94" font-size="16" fill="#a8b3cf">Every step is useful on its own; unattended delivery is an explicit final choice.</text>

    <rect x="50" y="138" width="250" height="258" rx="18" fill="#111a2d" stroke="#2b3b60"/>
    <circle cx="82" cy="176" r="17" fill="#102e48"/><text x="77" y="182" font-size="16" font-weight="700" fill="#bae6fd">1</text>
    <text x="111" y="181" font-size="19" font-weight="700" fill="#f8fafc">Observe agents</text>
    <text x="76" y="222" font-size="14" fill="#a8b3cf">See running, done, idle,</text>
    <text x="76" y="245" font-size="14" fill="#a8b3cf">and needs-input sessions.</text>
    <rect x="76" y="282" width="198" height="38" rx="10" fill="#17243d"/><text x="126" y="306" font-size="14" font-weight="700" fill="#bae6fd">WATCH</text>
    <text x="76" y="357" font-size="12" fill="#7180a1">No board required</text>

    <path d="M310 267h28" stroke="#536487" stroke-width="2"/><path d="M330 259l8 8-8 8" fill="none" stroke="#536487" stroke-width="2"/>

    <rect x="348" y="138" width="250" height="258" rx="18" fill="#111a2d" stroke="#287b76"/>
    <circle cx="380" cy="176" r="17" fill="#123b3d"/><text x="375" y="182" font-size="16" font-weight="700" fill="#79e3d1">2</text>
    <text x="409" y="181" font-size="19" font-weight="700" fill="#f8fafc">Observe + isolate</text>
    <text x="374" y="222" font-size="14" fill="#a8b3cf">Run full-permission agents</text>
    <text x="374" y="245" font-size="14" fill="#a8b3cf">inside the repo boundary.</text>
    <rect x="374" y="282" width="198" height="38" rx="10" fill="#123b3d"/><text x="402" y="306" font-size="14" font-weight="700" fill="#79e3d1">WATCH + SANDBOX</text>
    <text x="374" y="357" font-size="12" fill="#7180a1">Only this repo mounted</text>

    <path d="M608 267h28" stroke="#536487" stroke-width="2"/><path d="M628 259l8 8-8 8" fill="none" stroke="#536487" stroke-width="2"/>

    <rect x="646" y="138" width="250" height="258" rx="18" fill="#111a2d" stroke="#7650c7"/>
    <circle cx="678" cy="176" r="17" fill="#302352"/><text x="673" y="182" font-size="16" font-weight="700" fill="#d5c4ff">3</text>
    <text x="707" y="181" font-size="19" font-weight="700" fill="#f8fafc">Ticket to PR</text>
    <text x="672" y="222" font-size="14" fill="#a8b3cf">Refine, plan, implement,</text>
    <text x="672" y="245" font-size="14" fill="#a8b3cf">review, and follow through.</text>
    <rect x="672" y="282" width="198" height="38" rx="10" fill="#292044"/><text x="706" y="306" font-size="14" font-weight="700" fill="#d5c4ff">ALL THREE LAYERS</text>
    <text x="672" y="357" font-size="12" fill="#7180a1">Human-gated delivery</text>

    <path d="M906 267h28" stroke="#536487" stroke-width="2"/><path d="M926 259l8 8-8 8" fill="none" stroke="#536487" stroke-width="2"/>

    <rect x="944" y="138" width="206" height="258" rx="18" fill="#19142f" stroke="#9333ea" stroke-width="2"/>
    <circle cx="976" cy="176" r="17" fill="url(#active)"/><text x="971" y="182" font-size="16" font-weight="700" fill="#ffffff">4</text>
    <text x="1005" y="181" font-size="19" font-weight="700" fill="#f8fafc">Full loop</text>
    <text x="970" y="222" font-size="14" fill="#bba8dd">Dispatch and conditional</text>
    <text x="970" y="245" font-size="14" fill="#bba8dd">automerge, explicitly armed.</text>
    <rect x="970" y="282" width="154" height="38" rx="10" fill="url(#active)"/><text x="992" y="306" font-size="14" font-weight="700" fill="#ffffff">4 OPT-IN SWITCHES</text>
    <text x="970" y="357" font-size="12" fill="#a78bfa">Per-ticket merge grant</text>

    <rect x="50" y="424" width="1100" height="38" rx="12" fill="#0d1528" stroke="#243454"/>
    <text x="74" y="448" font-size="13" fill="#a8b3cf">Current installer: all components</text>
    <text x="312" y="448" font-size="13" fill="#536487">•</text>
    <text x="334" y="448" font-size="13" fill="#a8b3cf">2.1: selectable layers</text>
    <text x="518" y="448" font-size="13" fill="#536487">•</text>
    <text x="540" y="448" font-size="13" fill="#a8b3cf">3.0: trusted autonomy hardening</text>
    <text x="806" y="448" font-size="13" fill="#536487">•</text>
    <text x="828" y="448" font-size="13" fill="#a8b3cf">3.1: one readiness experience</text>
  </g>
</svg>
