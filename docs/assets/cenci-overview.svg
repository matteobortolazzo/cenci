<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">cenci product overview</title>
  <desc id="desc">Three connected layers give coding agents isolation, a gated workflow, and visible status while people retain the important decisions.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111b35"/>
    </linearGradient>
    <linearGradient id="workflow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="630" rx="28" fill="url(#background)"/>
  <circle cx="1092" cy="44" r="180" fill="#8b5cf6" opacity="0.08"/>
  <circle cx="82" cy="612" r="180" fill="#2dd4bf" opacity="0.07"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="56" y="42" width="124" height="30" rx="15" fill="#18233d" stroke="#33466f"/>
    <circle cx="76" cy="57" r="5" fill="#55d6be"/>
    <text x="90" y="62" font-size="14" font-weight="700" fill="#d8e2ff" letter-spacing="0.4">cenci</text>

    <text x="56" y="124" font-size="42" font-weight="750" fill="#f8fafc">Let agents run. Keep the decisions.</text>
    <text x="56" y="158" font-size="18" fill="#a8b3cf">A secure, human-gated path from issue to reviewed pull request.</text>

    <g filter="url(#shadow)">
      <rect x="56" y="202" width="332" height="280" rx="20" fill="#131b2f" stroke="#2b3b60"/>
      <rect x="434" y="202" width="332" height="280" rx="20" fill="#131b2f" stroke="#6d4ac7"/>
      <rect x="812" y="202" width="332" height="280" rx="20" fill="#131b2f" stroke="#2b3b60"/>
    </g>

    <circle cx="98" cy="246" r="21" fill="#123b3d"/>
    <path d="M98 232l14 5v10c0 10-6 17-14 21-8-4-14-11-14-21v-10l14-5z" fill="none" stroke="#55d6be" stroke-width="2.5"/>
    <text x="130" y="242" font-size="13" font-weight="700" fill="#55d6be" letter-spacing="1.5">ISOLATION</text>
    <text x="82" y="302" font-size="25" font-weight="700" fill="#f8fafc">Contain the blast radius</text>
    <text x="82" y="339" font-size="16" fill="#a8b3cf">Full-permission sessions stay inside</text>
    <text x="82" y="364" font-size="16" fill="#a8b3cf">a Docker or Podman boundary.</text>
    <rect x="82" y="402" width="250" height="42" rx="10" fill="#0c1428" stroke="#263758"/>
    <circle cx="104" cy="423" r="5" fill="#55d6be"/>
    <text x="119" y="428" font-size="14" fill="#d8e2ff">only this repo → /workspace</text>

    <circle cx="476" cy="246" r="21" fill="#302352"/>
    <path d="M466 246h20m-7-7l7 7-7 7" fill="none" stroke="#c4a7ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="508" y="242" font-size="13" font-weight="700" fill="#c4a7ff" letter-spacing="1.5">WORKFLOW</text>
    <text x="460" y="302" font-size="25" font-weight="700" fill="#f8fafc">Approve the intent</text>
    <text x="460" y="339" font-size="16" fill="#a8b3cf">People shape scope and approve plans.</text>
    <text x="460" y="364" font-size="16" fill="#a8b3cf">Agents handle the mechanical path.</text>
    <g font-size="13" font-weight="650">
      <rect x="460" y="402" width="68" height="30" rx="15" fill="#163b3c"/><text x="474" y="422" fill="#79e3d1">refine</text>
      <text x="536" y="422" fill="#607293">→</text>
      <rect x="554" y="402" width="58" height="30" rx="15" fill="#302352"/><text x="569" y="422" fill="#d5c4ff">plan</text>
      <text x="620" y="422" fill="#607293">→</text>
      <rect x="638" y="402" width="74" height="30" rx="15" fill="url(#workflow)"/><text x="652" y="422" fill="#ffffff">deliver</text>
    </g>
    <text x="460" y="459" font-size="12" fill="#7180a1">human gate</text>
    <line x1="530" y1="455" x2="610" y2="455" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="4 5"/>

    <circle cx="854" cy="246" r="21" fill="#342b16"/>
    <path d="M843 250h5l4-9 6 16 4-7h5" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="886" y="242" font-size="13" font-weight="700" fill="#fbbf24" letter-spacing="1.5">ATTENTION</text>
    <text x="838" y="302" font-size="25" font-weight="700" fill="#f8fafc">Know when to step in</text>
    <text x="838" y="339" font-size="16" fill="#a8b3cf">Live hooks route session state to</text>
    <text x="838" y="364" font-size="16" fill="#a8b3cf">tmux and desktop status surfaces.</text>
    <g font-size="13" font-weight="650">
      <rect x="838" y="402" width="86" height="30" rx="15" fill="#102e48"/><circle cx="856" cy="417" r="4" fill="#38bdf8"/><text x="867" y="422" fill="#bae6fd">running</text>
      <rect x="932" y="402" width="88" height="30" rx="15" fill="#431d26"/><circle cx="950" cy="417" r="4" fill="#fb7185"/><text x="961" y="422" fill="#fecdd3">input</text>
      <rect x="1028" y="402" width="86" height="30" rx="15" fill="#143526"/><circle cx="1046" cy="417" r="4" fill="#4ade80"/><text x="1057" y="422" fill="#bbf7d0">done</text>
    </g>

    <path d="M396 342h26" stroke="#536487" stroke-width="2" stroke-linecap="round"/>
    <path d="M415 335l7 7-7 7" fill="none" stroke="#536487" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M774 342h26" stroke="#536487" stroke-width="2" stroke-linecap="round"/>
    <path d="M793 335l7 7-7 7" fill="none" stroke="#536487" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="56" y="522" width="1088" height="66" rx="16" fill="#0d1528" stroke="#243454"/>
    <text x="82" y="561" font-size="14" font-weight="700" fill="#55d6be" letter-spacing="1">YOU</text>
    <text x="126" y="561" font-size="15" fill="#d8e2ff">scope · approve · decide</text>
    <line x1="352" y1="555" x2="834" y2="555" stroke="#33466f" stroke-width="2" stroke-dasharray="4 7"/>
    <circle cx="593" cy="555" r="7" fill="#8b5cf6"/>
    <text x="867" y="561" font-size="14" font-weight="700" fill="#c4a7ff" letter-spacing="1">AGENT</text>
    <text x="928" y="561" font-size="15" fill="#d8e2ff">test · build · review</text>
  </g>
</svg>
