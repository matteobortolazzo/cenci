<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">The guarded cenci autonomous loop</title>
  <desc id="desc">A refined issue can move through dispatch, planning, implementation, pull request babysitting, and conditional automerge only when repository policy, fleet enablement, and an explicit per-ticket grant all allow it. Any failed gate holds the loop for a person.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#111b35"/></linearGradient>
    <linearGradient id="active" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#6d28d9"/><stop offset="1" stop-color="#9333ea"/></linearGradient>
  </defs>
  <rect width="1200" height="520" rx="24" fill="url(#bg)"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="50" y="62" font-size="30" font-weight="750" fill="#f8fafc">Full speed is a policy chain, not one dangerous switch.</text>
    <text x="50" y="94" font-size="16" fill="#a8b3cf">Every link is opt-in. A failed or unreadable condition stops at a visible human hold.</text>

    <text x="50" y="137" font-size="12" font-weight="700" fill="#8292b6" letter-spacing="1.3">REPOSITORY + HOST READINESS</text>
    <rect x="50" y="154" width="254" height="54" rx="12" fill="#10252c" stroke="#287b76"/><text x="69" y="177" font-size="13" font-weight="700" fill="#79e3d1">1 · Lean planning</text><text x="69" y="196" font-size="11" fill="#a8c8c7">repo-owned, reviewed config</text>
    <rect x="320" y="154" width="254" height="54" rx="12" fill="#10252c" stroke="#287b76"/><text x="339" y="177" font-size="13" font-weight="700" fill="#79e3d1">2 · Dispatch planning</text><text x="339" y="196" font-size="11" fill="#a8c8c7">repo policy + host enrollment</text>
    <rect x="590" y="154" width="254" height="54" rx="12" fill="#10252c" stroke="#287b76"/><text x="609" y="177" font-size="13" font-weight="700" fill="#79e3d1">3 · Automerge policy</text><text x="609" y="196" font-size="11" fill="#a8c8c7">conditions committed on default</text>
    <rect x="860" y="154" width="290" height="54" rx="12" fill="#10252c" stroke="#287b76"/><text x="879" y="177" font-size="13" font-weight="700" fill="#79e3d1">4 · Fleet automerge enabled</text><text x="879" y="196" font-size="11" fill="#a8c8c7">host-owned reversible kill switch</text>

    <path d="M92 304h976" stroke="#536487" stroke-width="2"/>
    <path d="M1060 296l8 8-8 8" fill="none" stroke="#536487" stroke-width="2"/>
    <rect x="50" y="266" width="158" height="76" rx="14" fill="#17243d" stroke="#2b3b60"/><text x="77" y="297" font-size="15" font-weight="700" fill="#e9eefc">Refined issue</text><text x="77" y="321" font-size="11" fill="#8292b6">authorized inputs</text>
    <rect x="230" y="266" width="158" height="76" rx="14" fill="#17243d" stroke="#2b3b60"/><text x="269" y="297" font-size="15" font-weight="700" fill="#e9eefc">Dispatch</text><text x="252" y="321" font-size="11" fill="#8292b6">capacity + dependencies</text>
    <rect x="410" y="266" width="158" height="76" rx="14" fill="#17243d" stroke="#7650c7"/><text x="453" y="297" font-size="15" font-weight="700" fill="#e9eefc">Plan</text><text x="435" y="321" font-size="11" fill="#bba8dd">approved or lean</text>
    <rect x="590" y="266" width="158" height="76" rx="14" fill="url(#active)"/><text x="621" y="297" font-size="15" font-weight="700" fill="#ffffff">Implement</text><text x="614" y="321" font-size="11" fill="#eadcff">test · review · PR</text>
    <rect x="770" y="266" width="158" height="76" rx="14" fill="#2a2413" stroke="#8e6a1b"/><text x="811" y="297" font-size="15" font-weight="700" fill="#fff4ca">Babysit</text><text x="793" y="321" font-size="11" fill="#d2bd81">CI + reviewer state</text>
    <rect x="950" y="266" width="200" height="76" rx="14" fill="#143526" stroke="#278b56"/><text x="982" y="297" font-size="15" font-weight="700" fill="#bbf7d0">Conditional merge</text><text x="981" y="321" font-size="11" fill="#86cfa5">then next eligible ticket</text>

    <rect x="50" y="380" width="1100" height="92" rx="16" fill="#0d1528" stroke="#431d26"/>
    <circle cx="82" cy="413" r="9" fill="#fb7185"/><text x="105" y="418" font-size="15" font-weight="700" fill="#fecdd3">Human hold</text>
    <text x="205" y="418" font-size="13" fill="#a8b3cf">unknown CI · review feedback · policy mismatch · conflict · missing capacity · authorization drift</text>
    <line x1="76" y1="438" x2="1124" y2="438" stroke="#243454"/>
    <text x="76" y="458" font-size="12" font-weight="700" fill="#fbbf24">EXPLICIT MERGE GRANT</text>
    <text x="232" y="458" font-size="12" fill="#d8e2ff">The per-ticket automerge authorization is always a human decision, even when every other switch is armed.</text>
  </g>
</svg>
