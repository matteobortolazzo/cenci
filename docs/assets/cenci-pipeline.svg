<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">cenci delivery pipeline</title>
  <desc id="desc">A ticket moves through human refinement and planning, an autonomous implementation and review run, and pull request follow-through.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#111b35"/></linearGradient>
    <linearGradient id="run" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#6d28d9"/><stop offset="1" stop-color="#9333ea"/></linearGradient>
  </defs>
  <rect width="1200" height="430" rx="24" fill="url(#bg)"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="50" y="65" font-size="30" font-weight="750" fill="#f8fafc">One ticket. Clear handoffs. A reviewed PR.</text>
    <text x="50" y="96" font-size="16" fill="#a8b3cf">Human judgment frames the work; the approved run handles the repetitive engineering loop.</text>

    <text x="50" y="145" font-size="12" font-weight="700" fill="#55d6be" letter-spacing="1.4">HUMAN-GATED</text>
    <rect x="50" y="163" width="365" height="138" rx="18" fill="#10252c" stroke="#287b76"/>
    <g fill="#dffcf7">
      <text x="76" y="202" font-size="18" font-weight="700">Refine scope</text>
      <text x="76" y="234" font-size="14" fill="#a8c8c7">clarify intent · split work · surface risks</text>
      <line x1="76" y1="252" x2="389" y2="252" stroke="#245b5b"/>
      <text x="76" y="281" font-size="18" font-weight="700">Review the plan</text>
    </g>
    <circle cx="395" cy="183" r="8" fill="#2dd4bf"/>

    <path d="M427 232h46" stroke="#536487" stroke-width="2"/><path d="M465 224l8 8-8 8" fill="none" stroke="#536487" stroke-width="2"/>

    <text x="486" y="145" font-size="12" font-weight="700" fill="#c4a7ff" letter-spacing="1.4">AUTONOMOUS RUN</text>
    <rect x="486" y="163" width="475" height="138" rx="18" fill="#19142f" stroke="#7650c7"/>
    <rect x="510" y="187" width="104" height="38" rx="10" fill="#292044"/><text x="533" y="212" font-size="14" font-weight="650" fill="#e9ddff">tests red</text>
    <text x="624" y="212" font-size="17" fill="#756992">→</text>
    <rect x="650" y="187" width="104" height="38" rx="10" fill="#292044"/><text x="672" y="212" font-size="14" font-weight="650" fill="#e9ddff">build green</text>
    <text x="764" y="212" font-size="17" fill="#756992">→</text>
    <rect x="790" y="187" width="145" height="38" rx="10" fill="url(#run)"/><text x="811" y="212" font-size="14" font-weight="650" fill="#ffffff">refactor + review</text>
    <line x1="510" y1="251" x2="935" y2="251" stroke="#382b5d"/>
    <text x="510" y="280" font-size="14" fill="#bba8dd">security review · code review · lessons · rebase · open PR</text>

    <path d="M973 232h46" stroke="#536487" stroke-width="2"/><path d="M1011 224l8 8-8 8" fill="none" stroke="#536487" stroke-width="2"/>

    <text x="1032" y="145" font-size="12" font-weight="700" fill="#fbbf24" letter-spacing="1.4">FOLLOW-THROUGH</text>
    <rect x="1032" y="163" width="118" height="138" rx="18" fill="#2a2413" stroke="#8e6a1b"/>
    <circle cx="1091" cy="205" r="22" fill="#3d3217"/>
    <path d="M1080 205l7 7 15-16" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1057" y="254" font-size="15" font-weight="700" fill="#fff4ca">CI + review</text>
    <text x="1065" y="279" font-size="13" fill="#d2bd81">to merge</text>

    <rect x="50" y="340" width="1100" height="50" rx="14" fill="#0d1528" stroke="#243454"/>
    <text x="76" y="371" font-size="13" font-weight="700" fill="#55d6be">New</text>
    <text x="116" y="371" fill="#536487">→</text><text x="139" y="371" font-size="13" fill="#d8e2ff">Refined</text>
    <text x="199" y="371" fill="#536487">→</text><text x="222" y="371" font-size="13" fill="#d8e2ff">[Designed]</text>
    <text x="301" y="371" fill="#536487">→</text><text x="324" y="371" font-size="13" font-weight="700" fill="#55d6be">Planned</text>
    <text x="383" y="371" fill="#536487">→</text><text x="406" y="371" font-size="13" fill="#d8e2ff">Working</text>
    <text x="467" y="371" fill="#536487">→</text><text x="490" y="371" font-size="13" fill="#d8e2ff">In Review</text>
    <text x="558" y="371" fill="#536487">→</text><text x="581" y="371" font-size="13" font-weight="700" fill="#fbbf24">Implemented</text>
    <text x="768" y="371" font-size="13" fill="#7180a1">the saved .plans/ file is the durable handoff</text>
  </g>
</svg>
