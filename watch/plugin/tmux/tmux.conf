# cenci default tmux experience.
#
# Loaded only by the dedicated cenci tmux server:
#   tmux -L cenci -f "${XDG_CONFIG_HOME:-$HOME/.config}/cenci/tmux.conf" new-session -A -s cenci
# It never runs on your default tmux server, so your own sessions and config
# are untouched. The installer manages a copy of this file; edit that copy and
# the installer will stop refreshing it.
#
# Agent markers come from cenci-watch user variables:
#   @cenci-symbol   per-window status symbol (set by the daemon)
#   @cenci-style    per-window tmux style for that symbol
#   @cenci-headroom-<agent>  remaining budget as an integer percent
# Window formats are set only at the global level (set -gw): the watch
# frontend prepends its own marker to a non-empty window-local format, so a
# window-local format here would show the marker twice.

# Server behaviour
set -s escape-time 10
set -s default-terminal tmux-256color
set -s focus-events on

# Windows and input (the prefix stays at its default, C-b)
set -g mouse on
set -g base-index 1
set -g renumber-windows on

# Transparent bottom status bar: tabs on the left, headroom and session on the right
set -g status on
set -g status-position bottom
set -g status-style bg=default
set -g status-justify left
set -g status-left ""
set -g status-left-length 0
set -g status-right-length 80

# Tabs: "<symbol> <name>", styled by @cenci-style when set. Fallbacks apply to
# windows the daemon is not tracking. Commas stay out of the fallback styles
# because they would split the conditional.
set -gw window-status-separator " "
set -gw window-status-format "#{?#{@cenci-style},#[#{@cenci-style}],#[fg=colour244]}#{?#{@cenci-symbol},#{@cenci-symbol},●} #W#[default]"
set -gw window-status-current-format "#{?#{@cenci-style},#[#{@cenci-style}],#[fg=colour255]#[bold]}#{?#{@cenci-symbol},#{@cenci-symbol},●} #W#[default]"

# Right side: each headroom segment only when set. The != guard keeps a value
# of 0 visible (a bare conditional treats 0 as false) and %% is a literal %
# because status-right passes through strftime.
set -g status-right "#{?#{!=:#{@cenci-headroom-claude},},#[fg=colour244]claude #[fg=colour250]#{@cenci-headroom-claude}%% #[default],}#{?#{!=:#{@cenci-headroom-codex},},#[fg=colour244]codex #[fg=colour250]#{@cenci-headroom-codex}%% #[default],}#S"
