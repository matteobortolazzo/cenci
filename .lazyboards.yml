# Generated by /cenci:configure — per-repo lazyboards board config.
# NOTE: a local `columns:` list REPLACES the global column list entirely — it
# never merges — so every column below carries its actions explicitly; nothing
# is inherited from ~/.config/lazyboards/config.yml.
columns:
  - name: New
    actions:
      R:
        name: Refine
        type: shell
        command: "cenci run refine {number}"

  - name: Refined
    actions:
      I:
        name: Implement
        type: shell
        command: "cenci run implement {number}"

  - name: Planned
    actions:
      I:
        name: Implement
        type: shell
        command: "cenci run implement {number}"
      E:
        name: Edit plan
        type: shell
        command: 'f=$(ls .plans/{number}-*.md 2>/dev/null | head -1); [ -n "$f" ] && tmux new-window -n plan-{number} "$EDITOR \"$f\""'
      V:
        name: View plan
        type: shell
        command: 'f=$(ls .plans/{number}-*.md 2>/dev/null | head -1); [ -n "$f" ] && tmux new-window -n plan-{number} "${PAGER:-less} \"$f\""'

  - name: In Review
    actions:
      W:
        name: Open worktree
        type: shell
        scope: pr
        command: 'tmux new-window -d -n pr-{pr_number} -c {pr_worktree}'
      Rw:
        name: Run watch worktree
        type: shell
        scope: pr
        command: 'tmux new-window -d -n pr-{pr_number} -c {pr_worktree}/''watch'' "go run ."'
      Tw:
        name: Test watch worktree
        type: shell
        scope: pr
        command: 'tmux new-window -d -n pr-{pr_number} -c {pr_worktree}/''watch'' "make test"'

# Board-level actions (default scope is "card" — they act on the selected card)
actions:
  C: { name: Claude, type: shell, command: "tmux new-window cn cs" }
  X: { name: Codex, type: shell, command: "tmux new-window cn xt" }
  S:
    {
      name: Sync,
      type: shell,
      command: 'tmux new-window -n sync "cn -- ''/sync''"',
    }
