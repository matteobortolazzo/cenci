name: issue-templates — CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    name: issue-templates-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      issue_templates: ${{ steps.filter.outputs.issue_templates }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            issue_templates:
              - '.github/ISSUE_TEMPLATE/**'
              - 'tests/issue-templates.test.sh'
              - '.github/workflows/issue-templates-ci.yml'

  test:
    name: issue-templates-test
    needs: changes
    if: ${{ needs.changes.outputs.issue_templates == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run issue template tests
        run: bash tests/issue-templates.test.sh
