name: agentflow — CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    name: agentflow-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      agentflow: ${{ steps.filter.outputs.agentflow }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            agentflow:
              - 'agentflow/**'
              - '.github/workflows/agentflow-ci.yml'

  test:
    name: agentflow-test
    needs: changes
    if: ${{ needs.changes.outputs.agentflow == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate AgentFlow JSON
        run: find agentflow -name '*.json' -print0 | xargs -0 -n1 jq empty
      - name: Verify Codex hook isolation
        run: bash agentflow/codex/hooks.test.sh
