name: flow — CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    name: flow-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      flow: ${{ steps.code.outputs.flow == 'true' || steps.extra.outputs.flow == 'true' }}
      maintenance: ${{ steps.extra.outputs.maintenance }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: code
        with:
          predicate-quantifier: 'every'
          list-files: json
          filters: |
            flow:
              - 'flow/**'
              - '!flow/AGENTS.md'
              - '!flow/CLAUDE.md'
              - '!flow/README.md'
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: extra
        with:
          list-files: json
          filters: |
            flow:
              - '.cenci/config.json' # Run the repository activation contract on config-only changes.
              - '.github/workflows/flow-ci.yml'
              - 'docs/pipeline-coverage-map.md'
              - 'watch/**/*_test.go'
            maintenance:
              - 'flow/skills/**'
              - 'flow/agents/**'
              - 'flow/hooks/**'
              - 'flow/docs/**'
              - 'flow/codex/**'
              - 'flow/opencode/**'
              - 'docs/**'
              - 'README.md'
              - 'flow/README.md'
              - 'flow/AGENTS.md'
              - 'flow/CLAUDE.md'
              - 'AGENTS.md'
              - 'CLAUDE.md'
              - '.cenci/config.json'
              - 'install.sh'
              - 'sandbox/**'
              - 'watch/**'
              - '.claude-plugin/**'
              - '*/.claude-plugin/**'
              - '.github/scripts/maintenance-*'
              - '.github/workflows/cenci-maintenance.yml'
              - '.github/workflows/workflow-lint.yml'
              - '.github/workflows/flow-ci.yml'
      - name: Report paths-filter decision
        env:
          CODE_FLOW: ${{ steps.code.outputs.flow }}
          CODE_FLOW_FILES: ${{ steps.code.outputs.flow_files }}
          EXTRA_FLOW: ${{ steps.extra.outputs.flow }}
          EXTRA_FLOW_FILES: ${{ steps.extra.outputs.flow_files }}
          OUT_FLOW: ${{ steps.code.outputs.flow == 'true' || steps.extra.outputs.flow == 'true' }}
          OUT_MAINTENANCE: ${{ steps.extra.outputs.maintenance }}
          OUT_MAINTENANCE_FILES: ${{ steps.extra.outputs.maintenance_files }}
        run: |
          {
            echo "### flow paths-filter decision"
            echo '```'
            echo "code  (every) flow = ${CODE_FLOW}"
            echo "             matched: ${CODE_FLOW_FILES}"
            echo "extra (some)  flow = ${EXTRA_FLOW}"
            echo "             matched: ${EXTRA_FLOW_FILES}"
            echo "job output    flow = ${OUT_FLOW}"
            echo "job output    maintenance = ${OUT_MAINTENANCE}"
            echo "             matched: ${OUT_MAINTENANCE_FILES}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

  maintenance:
    name: flow-maintenance
    needs: changes
    if: ${{ needs.changes.outputs.maintenance == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Run maintain checker (changed files)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          CHECKOUT_ROOT="${GITHUB_WORKSPACE}"
          if [[ "$CHECKOUT_ROOT" != /* ]]; then
            echo "GITHUB_WORKSPACE must be an absolute path" >&2
            exit 2
          fi
          CHANGED_FILE="$(mktemp)"
          trap 'rm -f "$CHANGED_FILE"' EXIT
          git -C "$CHECKOUT_ROOT" diff --name-only "${BASE_SHA}"...HEAD > "$CHANGED_FILE"
          mapfile -t CHANGED < "$CHANGED_FILE"
          cd "$CHECKOUT_ROOT"
          bash flow/skills/maintain/scripts/check.sh --changed "${CHANGED[@]}"
      - name: Run maintain checker (full report-only)
        if: ${{ github.event_name != 'pull_request' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          CHECKOUT_ROOT="${GITHUB_WORKSPACE}"
          if [[ "$CHECKOUT_ROOT" != /* ]]; then
            echo "GITHUB_WORKSPACE must be an absolute path" >&2
            exit 2
          fi
          cd "$CHECKOUT_ROOT"
          bash flow/skills/maintain/scripts/check.sh

  test:
    name: flow-test
    needs: changes
    if: ${{ needs.changes.outputs.flow == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Run flow checks
        run: bash flow/scripts/run-checks.sh
