name: agentwatch — Version Bump

on:
  push:
    branches: [main]
    paths: ['agentwatch/**']

permissions:
  contents: write
  actions: write   # required for `gh workflow run` (workflow_dispatch API)

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    uses: ./.github/workflows/plugin-version-bump.yml
    with:
      plugin-name: agentwatch
      plugin-json-paths: agentwatch/plugin/.claude-plugin/plugin.json agentwatch/plugin/.codex-plugin/plugin.json
      marketplace-name: agentwatch
      tag-prefix: agentwatch
      dispatch-workflow: agentwatch-release.yml
    secrets: inherit
