name: sandbox — CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    name: sandbox-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sandbox: ${{ steps.code.outputs.sandbox == 'true' || steps.extra.outputs.sandbox == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: code
        with:
          predicate-quantifier: 'every'
          list-files: json
          filters: |
            sandbox:
              - 'sandbox/**'
              - '!sandbox/AGENTS.md'
              - '!sandbox/CLAUDE.md'
              - '!sandbox/README.md'
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: extra
        with:
          list-files: json
          filters: |
            sandbox:
              - 'install.sh'
      - name: Report paths-filter decision
        env:
          CODE_SANDBOX: ${{ steps.code.outputs.sandbox }}
          CODE_SANDBOX_FILES: ${{ steps.code.outputs.sandbox_files }}
          EXTRA_SANDBOX: ${{ steps.extra.outputs.sandbox }}
          EXTRA_SANDBOX_FILES: ${{ steps.extra.outputs.sandbox_files }}
          OUT_SANDBOX: ${{ steps.code.outputs.sandbox == 'true' || steps.extra.outputs.sandbox == 'true' }}
        run: |
          {
            echo "### sandbox paths-filter decision"
            echo '```'
            echo "code  (every) sandbox = ${CODE_SANDBOX}"
            echo "              matched: ${CODE_SANDBOX_FILES}"
            echo "extra (some)  sandbox = ${EXTRA_SANDBOX}"
            echo "              matched: ${EXTRA_SANDBOX_FILES}"
            echo "job output    sandbox = ${OUT_SANDBOX}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

  lint:
    name: sandbox-lint
    needs: changes
    if: ${{ needs.changes.outputs.sandbox == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: |
          shellcheck install.sh \
            sandbox/entrypoint.sh \
            sandbox/lib/*.sh \
            sandbox/tests/*.test.sh \
            sandbox/tests/lib/*.sh
      - name: bash -n (syntax check)
        run: |
          for f in install.sh sandbox/entrypoint.sh sandbox/lib/*.sh sandbox/tests/*.test.sh sandbox/tests/lib/*.sh; do
            bash -n "$f"
          done

  test:
    name: sandbox-test
    needs: changes
    if: ${{ needs.changes.outputs.sandbox == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run host-runnable test suites
        run: |
          set -uo pipefail
          # Discover suites instead of enumerating them (flow's #720 principle,
          # applied here). The previous hand-written list had silently drifted:
          # dind, lazyboards-install, opencode-config, opencode-plugins,
          # setup-skill-content, startup-marker and uninstall all existed and
          # were documented in sandbox/AGENTS.md but never ran in CI, so a
          # change to a shared gate could break them undetected (#784).
          #
          # EXCLUDE holds only suites owned by another job in this workflow, so
          # they are not run twice — never a suite that is merely failing.
          EXCLUDE="fragments-drift.test.sh smoke.test.sh"
          failed=""
          ran=0
          for suite in sandbox/tests/*.test.sh; do
            [ -e "${suite}" ] || continue
            name="$(basename "${suite}")"
            case " ${EXCLUDE} " in *" ${name} "*) continue ;; esac
            echo "::group::${name}"
            if bash "${suite}"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              failed="${failed} ${name}"
            fi
            ran=$((ran + 1))
          done
          echo "suites run=${ran} failed=${failed:-none}"
          if [ "${ran}" -eq 0 ]; then
            echo "no suites discovered — glob or path is wrong" >&2
            exit 1
          fi
          if [ -n "${failed}" ]; then
            echo "FAILED suites:${failed}" >&2
            exit 1
          fi

  fragment-drift:
    name: sandbox-fragment-drift
    needs: changes
    if: ${{ needs.changes.outputs.sandbox == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assert fragments match the Dockerfile monolith
        run: bash sandbox/tests/fragments-drift.test.sh

  build-smoke:
    name: sandbox-build-smoke
    needs: changes
    if: ${{ needs.changes.outputs.sandbox == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build base + monolith and run the toolchain smoke test
        run: bash sandbox/tests/smoke.test.sh

  hadolint:
    name: sandbox-hadolint
    needs: changes
    if: ${{ needs.changes.outputs.sandbox == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: sandbox/Dockerfile.base
          # DL3066: named USER root/dev switches are intentional throughout the multi-stage build.
          ignore: DL3008,DL3013,DL3066
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: sandbox/Dockerfile
          # DL3066: named USER root/dev switches are intentional throughout the multi-stage build.
          ignore: DL3008,DL3013,DL3066
