name: sandbox — CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    name: sandbox-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sandbox: ${{ steps.filter.outputs.sandbox }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            sandbox:
              - 'sandbox/**'
              - 'install.sh'
              - '!sandbox/AGENTS.md'
              - '!sandbox/CLAUDE.md'

  lint:
    name: sandbox-lint
    needs: changes
    if: ${{ needs.changes.outputs.sandbox == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: |
          shellcheck install.sh \
            sandbox/entrypoint.sh \
            sandbox/lib/*.sh \
            sandbox/tests/*.test.sh \
            sandbox/tests/lib/*.sh
      - name: bash -n (syntax check)
        run: |
          for f in install.sh sandbox/entrypoint.sh sandbox/lib/*.sh sandbox/tests/*.test.sh sandbox/tests/lib/*.sh; do
            bash -n "$f"
          done

  test:
    name: sandbox-test
    needs: changes
    if: ${{ needs.changes.outputs.sandbox == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run host-runnable test suites
        run: |
          bash sandbox/tests/settings-merge.test.sh
          bash sandbox/tests/heal-plugins.test.sh
          bash sandbox/tests/agent-cli.test.sh
          bash sandbox/tests/codex-config.test.sh
          bash sandbox/tests/seed-auth.test.sh
          bash sandbox/tests/installer-clients.test.sh
          bash sandbox/tests/install-update.test.sh
          bash sandbox/tests/cenci-widgets.test.sh

  fragment-drift:
    name: sandbox-fragment-drift
    needs: changes
    if: ${{ needs.changes.outputs.sandbox == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Assert fragments match the Dockerfile monolith
        run: bash sandbox/tests/fragments-drift.test.sh

  build-smoke:
    name: sandbox-build-smoke
    needs: changes
    if: ${{ needs.changes.outputs.sandbox == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build base + monolith and run the toolchain smoke test
        run: bash sandbox/tests/smoke.test.sh

  hadolint:
    name: sandbox-hadolint
    needs: changes
    if: ${{ needs.changes.outputs.sandbox == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: sandbox/Dockerfile.base
          ignore: DL3008,DL3013
      - uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: sandbox/Dockerfile
          ignore: DL3008,DL3013
