name: watch — Release

# Triggered two ways:
#   * push of a `watch/v*` tag (manual/local tag pushes with a real token), and
#   * workflow_dispatch from the version-bump job, which is how the automated path
#     works: a tag *pushed by GITHUB_TOKEN* does NOT fire `on: push: tags` (GitHub's
#     recursion guard), but workflow_dispatch/repository_dispatch ARE allowed with
#     GITHUB_TOKEN — so the bump job dispatches this workflow explicitly.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.6.0 (no "watch/v" prefix)'
        required: true
  push:
    tags:
      - 'watch/v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # The resolve step below runs a script from .github/scripts, so the repo
      # has to be on disk before it — a job's first step starts on an empty
      # workspace. This can't be solved by reordering: the build checkout's ref
      # is refs/tags/watch/v${{ steps.v.outputs.version }}, which that very step
      # produces. So check out just the scripts dir first, cheaply (#690).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          fetch-depth: 1

      - name: Resolve version and tag
        id: v
        env:
          # Passed through env vars, never interpolated into the run: body —
          # workflow_dispatch's version input is untrusted, manually-typed
          # text; interpolating it directly into shell source would let a
          # crafted value inject shell commands (#626).
          EVENT_NAME: ${{ github.event_name }}
          VERSION_INPUT: ${{ github.event.inputs.version }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: bash .github/scripts/resolve-release-version.sh

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Always build from the tag's commit, regardless of which ref dispatched us.
          ref: refs/tags/watch/v${{ steps.v.outputs.version }}
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.x'

      # OSS GoReleaser can't strip a monorepo tag prefix (watch/vX.Y.Z) — that's
      # Pro-only — so it is pointed at a clean semver via GORELEASER_CURRENT_TAG,
      # and the prefixed tag is published by the step further below. Until
      # goreleaser v2.18.1 that name did not have to resolve to anything; v2.18.1
      # started reading the current tag's contents and aborts when the lookup
      # comes back empty ("couldn't get tag contents: unexpected git tag output
      # for \"vX.Y.Z\": \"\""), which broke the watch/v2.2.1 release and, through
      # the version-matched bootstrap download, silently killed watch in every
      # sandbox container (#1139). Materialising the alias as a real annotated tag
      # keeps the workaround self-contained instead of resting on how leniently
      # goreleaser happens to treat a dangling GORELEASER_CURRENT_TAG.
      #
      # The alias is local to this runner's checkout and is never pushed. It is
      # deliberately not part of the `watch/v*` namespace, so the previous-tag
      # lookup in the publish step below (`git tag -l 'watch/v*'`) cannot see it.
      #
      # An annotated tag is a real git object, so git writes a tagger line and
      # refuses without a committer identity. A runner's checkout has none, so
      # the step as first shipped died with "fatal: empty ident name ... not
      # allowed" (exit 128) and took every release from watch/v2.2.1 through
      # v2.4.2 down with it — the same silent-watch-in-every-sandbox outage
      # #1139 was opened for, just one step further along. The identity is set
      # here rather than in an earlier step because each `run:` block is its
      # own shell and no other step in this job configures one; it matches the
      # `github-actions[bot]` identity plugin-version-bump.yml and deps-bump.yml
      # already use.
      - name: Materialise the clean-semver alias tag for GoReleaser
        env:
          VERSION: ${{ steps.v.outputs.version }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          set -euo pipefail
          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::expected tag ${TAG} to be present in this checkout" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f -a "v${VERSION}" -m "cenci-watch v${VERSION}" "refs/tags/${TAG}^{commit}"

      - name: Build release artifacts
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # Pin the GoReleaser *binary* to an exact version. A floating '~> v2'
          # silently adopts every upstream minor/patch on the next release run:
          # v2.18.1's stricter current-tag handling landed that way and took the
          # release job down with no change on our side (#1139). This mirrors the
          # cosign-release pin below, which exists for the same reason.
          version: 'v2.18.1'
          args: release --clean --skip=publish,validate
          workdir: watch
        env:
          GORELEASER_CURRENT_TAG: v${{ steps.v.outputs.version }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Pin the cosign *binary*: cosign-installer otherwise tracks "latest".
          # cosign v3 flipped `sign-blob` to the Sigstore bundle format by
          # default (deprecating --output-signature/--output-certificate), which
          # silently broke watch/v0.26.0's release. Pinning keeps signing
          # deterministic across upstream default changes.
          cosign-release: 'v3.1.2'

      - name: Sign checksums with cosign (keyless)
        run: |
          set -euo pipefail
          if [ ! -f watch/dist/checksums.txt ]; then
            echo "watch/dist/checksums.txt not found" >&2
            exit 1
          fi
          # Emit a single self-contained Sigstore bundle (signature + signing
          # certificate). This is cosign v3's default output format; the older
          # --output-signature/--output-certificate flags are deprecated and
          # ignored under it, so we write the bundle explicitly via --bundle.
          cosign sign-blob --yes \
            --bundle watch/dist/checksums.txt.bundle \
            watch/dist/checksums.txt

      - name: Sign install.sh with cosign (keyless)
        run: |
          set -euo pipefail
          # install.sh comes from the tagged checkout above, so the bytes
          # signed here are the exact bytes the installer will download and
          # verify (#626) — never a mutable-branch copy.
          if [ ! -f install.sh ]; then
            echo "install.sh not found" >&2
            exit 1
          fi
          cosign sign-blob --yes \
            --bundle install.sh.bundle \
            install.sh

      - name: Attest build provenance for release tarballs
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'watch/dist/cenci_*.tar.gz'

      - name: Publish release to the watch/v* tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.v.outputs.tag }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          assets=(
            watch/dist/cenci_*.tar.gz
            watch/dist/checksums.txt
            watch/dist/checksums.txt.bundle
            install.sh
            install.sh.bundle
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            # GitHub-generated notes since the previous watch tag. All tags
            # are present (checkout uses fetch-depth: 0). The tag being released
            # sorts first; the previous one is the 2nd line. Falls back to plain
            # generated notes for the very first tagged release.
            PREV=$(git tag -l 'watch/v*' --sort=-v:refname | sed -n 2p)
            if [ -n "$PREV" ]; then
              gh release create "$TAG" "${assets[@]}" \
                --title "cenci-watch v${VERSION}" \
                --generate-notes \
                --notes-start-tag "$PREV"
            else
              gh release create "$TAG" "${assets[@]}" \
                --title "cenci-watch v${VERSION}" \
                --generate-notes
            fi
          fi

      - name: Verify the published installer signature
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          set -euo pipefail
          # Re-download the just-published install.sh/install.sh.bundle from
          # the release (not the local checkout copy) and verify them the
          # same way install.sh's own verify_installer_asset() does, closing
          # the loop the manual runbook step in docs/release-hygiene.md#8
          # used to be the only check for (#736 — that manual step evidently
          # never ran, and the regexp it was meant to validate had been
          # silently broken for every workflow_dispatch-triggered release).
          # The --certificate-identity-regexp value is grepped out of the
          # tagged checkout's own install.sh, never hardcoded here, so this
          # step can't itself drift from what install.sh actually enforces.
          identity_regexp="$(grep -m1 -- "--certificate-identity-regexp '" install.sh | sed -E "s/^[^']*'([^']*)'.*/\1/")"
          if [ -z "$identity_regexp" ]; then
            echo "could not extract --certificate-identity-regexp from install.sh" >&2
            exit 1
          fi
          verify_dir="$(mktemp -d)" || { echo "::error::failed to create temp directory for installer verification"; exit 1; }
          gh release download "$TAG" \
            -p 'install.sh' -p 'install.sh.bundle' \
            -D "$verify_dir" --clobber
          cosign verify-blob \
            --bundle "$verify_dir/install.sh.bundle" \
            --certificate-identity-regexp "$identity_regexp" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "$verify_dir/install.sh"
