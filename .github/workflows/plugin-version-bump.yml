name: Reusable — Plugin Version Bump

# Reusable version-bump logic shared by the per-plugin caller workflows
# (flow, watch, sandbox). Callers pass their plugin name,
# the plugin.json paths to stamp, the marketplace entry name, the tag prefix,
# and — only watch — a workflow to dispatch after tagging.
#
# This workflow declares NO top-level permissions: block. GitHub caps a
# reusable workflow's effective permissions to whatever the caller job
# grants, so declaring permissions here would only ever narrow (never
# widen) what a caller already has — and doing so risks silently capping a
# caller that legitimately needs more. Each caller workflow declares its own
# permissions block instead.

on:
  workflow_call:
    inputs:
      plugin-name:
        description: 'Plugin name, used for the commit message and release-commit skip guard'
        required: true
        type: string
      plugin-json-paths:
        description: 'Space-separated manifest paths to stamp; the first is the source of truth and must version under a top-level .version'
        required: true
        type: string
      marketplace-name:
        description: 'Plugin name as it appears in .claude-plugin/marketplace.json'
        required: true
        type: string
      tag-prefix:
        description: 'Tag prefix, e.g. flow -> refs/tags/flow/v<version>'
        required: true
        type: string
      dispatch-workflow:
        description: 'Optional workflow to dispatch after tagging (passed version=<new>)'
        required: false
        type: string
        default: ''

# One concurrency group PER PLUGIN, not one shared queue for all of them
# (#743). The shared `version-bump-main` queue this replaces was lossy:
# GitHub keeps at most ONE pending run per concurrency group and cancels any
# previously pending run, so a commit touching all three project paths fired
# three bumps — one ran, one queued, and the third silently displaced the
# queued one. A real release (the #742 installer-verification fix) was
# dropped exactly that way, reported as `cancelled` rather than `failure`,
# so nothing alerted. No `cancel-in-progress` setting removes that
# single-pending-slot limit, so serialization-by-queue cannot be made
# lossless and is not the right mechanism here.
#
# Keying the group on tag-prefix means different plugins never contend at
# all, while two runs for the SAME plugin still serialize — the only case
# where ordering genuinely matters, since they bump the same version file.
# The cross-plugin push race the shared queue was meant to prevent is now
# handled where it belongs, inside bump-plugin-version.sh: every attempt
# re-derives the whole bump from the live tip of origin/main, so a rejected
# push retries against the new tip instead of replaying a stale diff. That
# is strictly stronger than the old queue — it also survives races against
# any other pusher to main, which the queue never covered.
#
# cancel-in-progress stays false: a queued run for the same plugin must
# still execute, never be dropped. No caller may declare a version-bump-main
# concurrency group itself (see the caller workflows) — GitHub cancels the
# caller run when a reusable workflow it invoked enters a group it also holds.
concurrency:
  group: version-bump-main-${{ inputs.tag-prefix }}
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      # `ref: main` pins the checked-out tree (and therefore the push base)
      # to the live tip of main at run start, separate from ORIGINAL_SHA
      # below (the commit that triggered this run) — by the time a queued
      # run executes, main may already be ahead due to an earlier run for
      # this same plugin. fetch-depth: 0 also keeps ORIGINAL_SHA reachable
      # after bump-plugin-version.sh resets to a refreshed origin/main.
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # The bump itself lives in .github/scripts/bump-plugin-version.sh and is
      # covered by bump-plugin-version.test.sh. Keeping it out of this YAML is
      # what makes the push-retry loop testable — the loop is the #743 fix that
      # replaced the lossy shared concurrency queue, so it must not regress
      # silently. check-version-bump-concurrency.sh rule 5 enforces that this
      # step keeps delegating to the script rather than re-inlining the logic.
      - name: Bump version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLUGIN_NAME: ${{ inputs.plugin-name }}
          PLUGIN_JSON_PATHS: ${{ inputs.plugin-json-paths }}
          MARKETPLACE_NAME: ${{ inputs.marketplace-name }}
          TAG_PREFIX: ${{ inputs.tag-prefix }}
          DISPATCH_WORKFLOW: ${{ inputs.dispatch-workflow }}
          # The commit that triggered this run — NOT necessarily main's tip
          # by the time this step executes (see the checkout step's ref:
          # main comment above). Used only for the skip guard and bump-type
          # classification, both of which must inspect the triggering commit
          # itself, not whatever else landed on main while this run was
          # waiting or retrying its push.
          ORIGINAL_SHA: ${{ github.sha }}
        run: bash .github/scripts/bump-plugin-version.sh
