name: Reusable — Plugin Version Bump

# Reusable version-bump logic shared by the per-plugin caller workflows
# (flow, watch, sandbox). Callers pass their plugin name,
# the plugin.json paths to stamp, the marketplace entry name, the tag prefix,
# and — only watch — a workflow to dispatch after tagging.
#
# This workflow declares NO top-level permissions: block. GitHub caps a
# reusable workflow's effective permissions to whatever the caller job
# grants, so declaring permissions here would only ever narrow (never
# widen) what a caller already has — and doing so risks silently capping a
# caller that legitimately needs more. Each caller workflow declares its own
# permissions block instead.

on:
  workflow_call:
    inputs:
      plugin-name:
        description: 'Plugin name, used for the commit message and release-commit skip guard'
        required: true
        type: string
      plugin-json-paths:
        description: 'Space-separated manifest paths to stamp; the first is the source of truth and must version under a top-level .version'
        required: true
        type: string
      marketplace-name:
        description: 'Plugin name as it appears in .claude-plugin/marketplace.json'
        required: true
        type: string
      tag-prefix:
        description: 'Tag prefix, e.g. flow -> refs/tags/flow/v<version>'
        required: true
        type: string
      dispatch-workflow:
        description: 'Optional workflow to dispatch after tagging (passed version=<new>)'
        required: false
        type: string
        default: ''

# Serializes all plugin version bumps onto a single queue instead of one
# concurrency group per caller: this workflow reads/writes the same shared
# state (marketplace.json + a push to main), so two callers running at once
# (e.g. two plugins' paths changing in the same push) could race pushing
# and clobber each other's commit. cancel-in-progress stays false — a
# queued run must still execute, not be dropped, since it may bump a
# different plugin. No caller may declare this same concurrency group
# itself (see the caller workflows) — GitHub cancels the caller run when a
# reusable workflow it invoked enters a concurrency group it also holds.
concurrency:
  group: version-bump-main
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      # `ref: main` pins the checked-out tree (and therefore the push base)
      # to the live tip of main at run start, separate from ORIGINAL_SHA
      # below (the commit that triggered this run) — by the time a queued
      # run executes, main may already be ahead due to an earlier run in
      # this same concurrency group.
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLUGIN_NAME: ${{ inputs.plugin-name }}
          PLUGIN_JSON_PATHS: ${{ inputs.plugin-json-paths }}
          MARKETPLACE_NAME: ${{ inputs.marketplace-name }}
          TAG_PREFIX: ${{ inputs.tag-prefix }}
          DISPATCH_WORKFLOW: ${{ inputs.dispatch-workflow }}
          # The commit that triggered this run — NOT necessarily main's tip
          # by the time this step executes (see the checkout step's ref:
          # main comment above). Used only for the skip guard and bump-type
          # classification below, both of which must inspect the triggering
          # commit itself, not whatever else landed on main while this run
          # was queued behind the concurrency group.
          ORIGINAL_SHA: ${{ github.sha }}
        run: |
          # Skip if last commit is already a release commit
          LAST_MSG=$(git log -1 --pretty=format:"%s" "$ORIGINAL_SHA")
          if echo "$LAST_MSG" | grep -q "^chore(release): ${PLUGIN_NAME}/v"; then
            echo "Last commit is a release commit, skipping"
            exit 0
          fi

          # Read current version from the first plugin.json path (source of truth)
          # shellcheck disable=SC2086
          set -- $PLUGIN_JSON_PATHS
          SOURCE_JSON="$1"
          VERSION=$(jq -r '.version' "$SOURCE_JSON")
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)

          # Determine bump type from the triggering commit
          COMMITS=$(git log -1 --pretty=format:"%s%n%b" "$ORIGINAL_SHA")
          BUMP="patch"

          if echo "$COMMITS" | grep -qiE '^feat!:|^[a-z]+\(.*\)!:|^BREAKING[ -]CHANGE:'; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qiE '^feat(\(|:)'; then
            BUMP="minor"
          fi

          # Apply bump
          case $BUMP in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "Bumping $BUMP: $VERSION -> $NEW_VERSION"

          # Stamp every manifest path (source of truth + Codex manifest + any
          # status-bar frontend manifests). Frontends keep the version under
          # different keys: KDE Plasma applets use .KPlugin.Version; GNOME
          # extensions must keep .version an integer (managed by
          # extensions.gnome.org), so the semver goes into ."version-name"
          # (a string field GNOME Shell 45+ displays); everything else uses
          # a top-level .version.
          for p in $PLUGIN_JSON_PATHS; do
            if jq -e 'has("KPlugin")' "$p" > /dev/null; then
              FILTER='.KPlugin.Version = $v'
            elif jq -e 'has("shell-version")' "$p" > /dev/null; then
              FILTER='."version-name" = $v'
            else
              FILTER='.version = $v'
            fi
            jq --arg v "$NEW_VERSION" "$FILTER" "$p" > tmp.json && mv tmp.json "$p"
          done
          # Stamp the marketplace entry. Fail loudly if the name matches no entry
          # (e.g. a typo in a caller's marketplace-name input) — otherwise the jq
          # filter would silently no-op and ship a stale marketplace version.
          jq -e --arg n "$MARKETPLACE_NAME" '.plugins[] | select(.name == $n)' \
            .claude-plugin/marketplace.json > /dev/null \
            || { echo "no marketplace entry named '$MARKETPLACE_NAME' in .claude-plugin/marketplace.json" >&2; exit 1; }
          jq --arg v "$NEW_VERSION" --arg n "$MARKETPLACE_NAME" \
            '(.plugins[] | select(.name == $n)).version = $v' \
            .claude-plugin/marketplace.json > tmp.json && mv tmp.json .claude-plugin/marketplace.json

          # Commit and push
          # shellcheck disable=SC2086
          git add $PLUGIN_JSON_PATHS .claude-plugin/marketplace.json
          git commit -m "chore(release): ${PLUGIN_NAME}/v${NEW_VERSION}"
          git push origin HEAD:main

          # Create tag via GitHub API
          gh api repos/${{ github.repository }}/git/refs \
            -f ref="refs/tags/${TAG_PREFIX}/v${NEW_VERSION}" \
            -f sha="$(git rev-parse HEAD)"

          # Optionally dispatch a downstream workflow (watch release).
          # A tag pushed with GITHUB_TOKEN does NOT fire an `on: push: tags`
          # workflow (recursion guard), but dispatching one IS allowed. Run the
          # workflow definition from main (latest); it checks out the tag to build.
          if [ -n "$DISPATCH_WORKFLOW" ]; then
            gh workflow run "$DISPATCH_WORKFLOW" \
              --ref main \
              -f version="${NEW_VERSION}"
          fi
