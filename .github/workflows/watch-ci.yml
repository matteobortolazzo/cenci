name: watch — CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    name: watch-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      watch: ${{ steps.filter.outputs.watch }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            watch:
              - 'watch/**'
              - '.github/workflows/watch-ci.yml'

  test:
    name: watch-test
    needs: changes
    if: ${{ needs.changes.outputs.watch == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: watch
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
      - run: go test ./...
      - run: go build ./...
      - run: ./plugin/hooks/test.sh
      - run: ./plugin/codex/test.sh

  lint:
    name: watch-lint
    needs: changes
    if: ${{ needs.changes.outputs.watch == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: watch
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10.1
          working-directory: watch

  frontend-test:
    name: watch-frontend-test
    needs: changes
    if: ${{ needs.changes.outputs.watch == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: watch
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck plugin/*/install.sh
      - run: bash plugin/gnome/test.sh
      - run: bash plugin/plasma/test.sh
      - run: bash plugin/macos/test.sh
