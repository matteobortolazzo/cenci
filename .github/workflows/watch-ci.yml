name: watch — CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    name: watch-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      watch: ${{ steps.filter.outputs.watch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            watch:
              - 'watch/**'
              - 'sandbox/tests/lib/**'
              - '.github/workflows/watch-ci.yml'
              - '!watch/AGENTS.md'
              - '!watch/CLAUDE.md'
              - '!watch/README.md'

  test:
    name: watch-test
    needs: changes
    if: ${{ needs.changes.outputs.watch == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: watch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.x'
      - run: go test ./...
      - run: go build ./...
      - run: go build -o cenci .
      - run: ./plugin/hooks/test.sh
      - run: ./plugin/codex/test.sh
      - run: bash tests/reap-orphans.test.sh
        env:
          CENCI_BIN: ${{ github.workspace }}/watch/cenci

  lint:
    name: watch-lint
    needs: changes
    if: ${{ needs.changes.outputs.watch == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: watch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.x'
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.10.1
          working-directory: watch

  frontend-test:
    name: watch-frontend-test
    needs: changes
    if: ${{ needs.changes.outputs.watch == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: watch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck plugin/*/install.sh
      - run: bash plugin/gnome/test.sh
      - run: bash plugin/plasma/test.sh
      - run: bash plugin/macos/test.sh
