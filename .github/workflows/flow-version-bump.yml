name: flow — Version Bump

on:
  push:
    branches: [main]
    paths: ['flow/**']

permissions:
  contents: write

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    uses: ./.github/workflows/plugin-version-bump.yml
    with:
      plugin-name: cenci
      plugin-json-paths: flow/.claude-plugin/plugin.json flow/.codex-plugin/plugin.json
      marketplace-name: cenci
      tag-prefix: flow
    secrets: inherit
