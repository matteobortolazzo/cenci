name: dev-sandbox — Codex Bump

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check for new Codex release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          LATEST=$(npm view @openai/codex version)
          if ! echo "$LATEST" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "npm view returned an unexpected value: '$LATEST'" >&2
            exit 1
          fi

          CURRENT=$(sed -n 's/^ARG CODEX_VERSION=//p' dev-sandbox/Dockerfile)
          if [ "$LATEST" = "$CURRENT" ]; then
            echo "Codex is up to date ($CURRENT)"
            exit 0
          fi

          BRANCH="codex-bump-v${LATEST}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH already exists, skipping"
            exit 0
          fi

          echo "Bumping Codex CLI: $CURRENT -> $LATEST"

          git checkout -b "$BRANCH"
          sed -i 's/^ARG CODEX_VERSION=.*/ARG CODEX_VERSION='"${LATEST}"'/' dev-sandbox/Dockerfile
          git add dev-sandbox/Dockerfile
          git commit -m "chore(dev-sandbox): bump Codex CLI to ${LATEST}"
          git push -u origin "$BRANCH"

          BODY=$(printf 'Bumps `CODEX_VERSION` from %s to %s.\n\nCodex is baked into the monolith image only (no fragment, per dev-sandbox/CLAUDE.md). Run `agent-sand --build` to pick up the new version — no `--build-base` needed.\n\nAuto-merging: main is unprotected and this is a routine dependency bump.' "$CURRENT" "$LATEST")

          PR_URL=$(gh pr create \
            --title "chore(dev-sandbox): bump Codex CLI to ${LATEST}" \
            --body "$BODY" \
            --head "$BRANCH" \
            --base main)
          echo "Opened $PR_URL"

          MERGED=false
          for attempt in 1 2; do
            if gh pr merge "$BRANCH" --squash --delete-branch; then
              MERGED=true
              break
            fi
            echo "Merge attempt $attempt failed, retrying after a short wait..."
            sleep 15
          done

          if [ "$MERGED" != "true" ]; then
            echo "Failed to auto-merge $PR_URL after retry" >&2
            exit 1
          fi

          gh workflow run "agent-sandbox — Version Bump"
