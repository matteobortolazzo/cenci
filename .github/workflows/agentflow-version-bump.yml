name: agentflow — Version Bump

on:
  push:
    branches: [main]
    paths: ['agentflow/**']

permissions:
  contents: write
  # plugin-version-bump.yml declares actions: write at workflow level (needed
  # only by agentwatch's dispatch-workflow step); GitHub caps a reusable
  # workflow's permissions to what the caller grants, so every caller must
  # grant it too or the run fails validation before any job starts.
  actions: write

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    uses: ./.github/workflows/plugin-version-bump.yml
    with:
      plugin-name: agentflow
      plugin-json-paths: agentflow/.claude-plugin/plugin.json agentflow/.codex-plugin/plugin.json
      marketplace-name: agentflow
      tag-prefix: agentflow
    secrets: inherit
