name: agentflow — Version Bump

on:
  push:
    branches: [main]
    paths: ['agentflow/**']

permissions:
  contents: write

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    uses: ./.github/workflows/plugin-version-bump.yml
    with:
      plugin-name: agentflow
      plugin-json-paths: agentflow/.claude-plugin/plugin.json agentflow/.codex-plugin/plugin.json
      marketplace-name: agentflow
      tag-prefix: agentflow
    secrets: inherit
