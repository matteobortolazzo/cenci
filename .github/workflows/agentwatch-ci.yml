name: agentwatch — CI

on:
  push:
    branches: [main]
    paths: ['agentwatch/**']
  pull_request:
    branches: [main]
    paths: ['agentwatch/**']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentwatch
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
      - run: go test ./...
      - run: go build ./...
      - run: ./plugin/hooks/test.sh
      - run: ./plugin/codex/test.sh

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentwatch
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10.1
          working-directory: agentwatch
