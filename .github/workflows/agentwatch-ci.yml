name: agentwatch — CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    name: agentwatch-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      agentwatch: ${{ steps.filter.outputs.agentwatch }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            agentwatch:
              - 'agentwatch/**'
              - '.github/workflows/agentwatch-ci.yml'

  test:
    name: agentwatch-test
    needs: changes
    if: ${{ needs.changes.outputs.agentwatch == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentwatch
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
      - run: go test ./...
      - run: go build ./...
      - run: ./plugin/hooks/test.sh
      - run: ./plugin/codex/test.sh

  lint:
    name: agentwatch-lint
    needs: changes
    if: ${{ needs.changes.outputs.agentwatch == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentwatch
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10.1
          working-directory: agentwatch

  frontend-test:
    name: agentwatch-frontend-test
    needs: changes
    if: ${{ needs.changes.outputs.agentwatch == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentwatch
    steps:
      - uses: actions/checkout@v7
      - run: bash plugin/gnome/test.sh
      - run: bash plugin/plasma/test.sh
      - run: bash plugin/macos/test.sh
