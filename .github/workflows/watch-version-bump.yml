name: agentwatch — Version Bump

on:
  push:
    branches: [main]
    paths: ['agentwatch/**']

permissions:
  contents: write
  # The reusable plugin-version-bump.yml workflow declares no permissions
  # of its own (reusable workflows inherit whatever the caller grants), so
  # this caller-side grant is what enables the workflow's `gh workflow run`
  # dispatch step (this is the only caller that passes dispatch-workflow).
  actions: write

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    uses: ./.github/workflows/plugin-version-bump.yml
    with:
      plugin-name: agentwatch
      plugin-json-paths: >-
        agentwatch/plugin/.claude-plugin/plugin.json
        agentwatch/plugin/.codex-plugin/plugin.json
        agentwatch/plugin/noctalia/manifest.json
        agentwatch/plugin/dms/plugin.json
        agentwatch/plugin/gnome/metadata.json
        agentwatch/plugin/plasma/metadata.json
      marketplace-name: agentwatch
      tag-prefix: agentwatch
      dispatch-workflow: agentwatch-release.yml
    secrets: inherit
