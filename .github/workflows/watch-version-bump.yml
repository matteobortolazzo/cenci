name: watch — Version Bump

on:
  push:
    branches: [main]
    paths: ['watch/**']

permissions:
  contents: write
  # The reusable plugin-version-bump.yml workflow declares no permissions
  # of its own (reusable workflows inherit whatever the caller grants), so
  # this caller-side grant is what enables the workflow's `gh workflow run`
  # dispatch step (this is the only caller that passes dispatch-workflow).
  actions: write

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    uses: ./.github/workflows/plugin-version-bump.yml
    with:
      plugin-name: cenci-watch
      plugin-json-paths: >-
        watch/plugin/.claude-plugin/plugin.json
        watch/plugin/.codex-plugin/plugin.json
        watch/plugin/noctalia/manifest.json
        watch/plugin/dms/plugin.json
        watch/plugin/gnome/metadata.json
        watch/plugin/plasma/metadata.json
      marketplace-name: cenci-watch
      tag-prefix: watch
      dispatch-workflow: watch-release.yml
    secrets: inherit
