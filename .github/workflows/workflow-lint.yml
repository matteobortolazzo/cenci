name: Workflow — Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    name: workflows-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            workflows:
              - '.github/workflows/**'
              - '.github/scripts/**'
              - '**/*.md'

  check-permissions:
    needs: changes
    if: ${{ needs.changes.outputs.workflows == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check workflow permission declarations
        run: bash .github/scripts/check-workflow-permissions.sh
      - name: Run permission-check unit tests
        run: bash .github/scripts/check-workflow-permissions.test.sh
      - name: Check version-bump concurrency guards
        run: bash .github/scripts/check-version-bump-concurrency.sh
      - name: Run version-bump concurrency unit tests
        run: bash .github/scripts/check-version-bump-concurrency.test.sh
      - name: Check documentation links, anchors, and terminology
        run: python3 .github/scripts/check-docs.py
      - name: Run maintenance-issue unit tests
        run: bash .github/scripts/maintenance-issue.test.sh
      - name: Run maintenance workflow contract tests
        run: bash .github/scripts/maintenance-workflows.test.sh
      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  check-codeowners:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check CODEOWNERS path drift
        run: bash .github/scripts/check-codeowners.sh
      - name: Run CODEOWNERS drift-check unit tests
        run: bash .github/scripts/check-codeowners.test.sh
