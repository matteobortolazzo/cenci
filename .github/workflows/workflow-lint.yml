name: Workflow — Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    name: workflows-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            workflows:
              - '.github/workflows/**'
              - '.github/scripts/**'
              - '**/*.md'
              - 'install.sh'

  check-permissions:
    needs: changes
    if: ${{ needs.changes.outputs.workflows == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check workflow permission declarations
        run: bash .github/scripts/check-workflow-permissions.sh
      - name: Run permission-check unit tests
        run: bash .github/scripts/check-workflow-permissions.test.sh
      - name: Check version-bump concurrency guards
        run: bash .github/scripts/check-version-bump-concurrency.sh
      - name: Run version-bump concurrency unit tests
        run: bash .github/scripts/check-version-bump-concurrency.test.sh
      - name: Run plugin version-bump script tests
        run: bash .github/scripts/bump-plugin-version.test.sh
      - name: Check documentation links, anchors, and terminology
        run: python3 .github/scripts/check-docs.py
      - name: Run maintenance-issue unit tests
        run: bash .github/scripts/maintenance-issue.test.sh
      - name: Run maintenance workflow contract tests
        run: bash .github/scripts/maintenance-workflows.test.sh
      - name: Run release-version resolver unit tests
        run: bash .github/scripts/resolve-release-version.test.sh
      - name: Run watch-release workflow contract tests
        run: bash .github/scripts/watch-release-workflow.test.sh
      - name: Run installer identity-regexp drift tests
        run: bash .github/scripts/installer-identity-drift.test.sh
      - name: Check paths-filter negation/quantifier guard
        run: bash .github/scripts/check-paths-filters.sh
      - name: Run paths-filter guard unit tests
        run: bash .github/scripts/check-paths-filters.test.sh
      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  check-codeowners:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check CODEOWNERS path drift
        run: bash .github/scripts/check-codeowners.sh
      - name: Run CODEOWNERS drift-check unit tests
        run: bash .github/scripts/check-codeowners.test.sh
