name: cenci — Maintenance Audit

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cenci-maintenance-${{ github.repository }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.maintenance-enabled.outputs.enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read maintenance UX setting
        id: maintenance-enabled
        run: |
          set -euo pipefail
          ENABLED=true
          CONFIG_FILE="${GITHUB_WORKSPACE}/.cenci/config.json"
          if [[ -f "$CONFIG_FILE" ]]; then
            if ! CONFIGURED="$(jq -r '
              if (.maintenance? | type) == "object" and (.maintenance | has("enabled"))
              then .maintenance.enabled
              else true
              end
            ' "$CONFIG_FILE")"; then
              CONFIGURED=true
            fi
            case "$CONFIGURED" in
              true|false) ENABLED="$CONFIGURED" ;;
              *) ENABLED=true ;;
            esac
          fi
          printf 'enabled=%s\n' "$ENABLED" >> "$GITHUB_OUTPUT"

      # This step intentionally has no write-token environment. The checker receives only a
      # read-only checkout and writes its report to runner-local scratch state.
      - name: Run maintenance audit
        id: maintenance-audit
        if: ${{ steps.maintenance-enabled.outputs.enabled == 'true' }}
        env:
          REPORT_DIR: ${{ runner.temp }}/cenci-maintenance-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          CHECKOUT_ROOT="${GITHUB_WORKSPACE}"
          if [[ "$CHECKOUT_ROOT" != /* ]]; then
            echo "GITHUB_WORKSPACE must be an absolute path" >&2
            exit 2
          fi
          mkdir -p "$REPORT_DIR"
          REPORT_FILE="${REPORT_DIR}/report.json"
          cd "$CHECKOUT_ROOT"
          bash flow/skills/maintain/scripts/check.sh --strict --report-file "$REPORT_FILE"

      - name: Publish maintenance report
        if: ${{ always() && steps.maintenance-enabled.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cenci-maintenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cenci-maintenance-${{ github.run_id }}-${{ github.run_attempt }}/report.json
          if-no-files-found: error

  reconcile:
    needs: audit
    if: ${{ always() && needs.audit.outputs.enabled == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download maintenance report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cenci-maintenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cenci-maintenance-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Reconcile maintenance issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAINTENANCE_REPORT_FILE: ${{ runner.temp }}/cenci-maintenance-${{ github.run_id }}-${{ github.run_attempt }}/report.json
        run: |
          set -euo pipefail
          CHECKOUT_ROOT="${GITHUB_WORKSPACE}"
          if [[ "$CHECKOUT_ROOT" != /* ]]; then
            echo "GITHUB_WORKSPACE must be an absolute path" >&2
            exit 2
          fi
          cd "$CHECKOUT_ROOT"
          if [[ "${{ needs.audit.result }}" == "success" ]]; then
            bash .github/scripts/maintenance-issue.sh resolve
          else
            bash .github/scripts/maintenance-issue.sh report
          fi
