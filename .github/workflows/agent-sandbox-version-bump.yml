name: agent-sandbox — Version Bump

on:
  push:
    branches: [main]
    paths: ['dev-sandbox/**']
  workflow_dispatch:

permissions:
  contents: write
  # plugin-version-bump.yml declares actions: write at workflow level (needed
  # only by agentwatch's dispatch-workflow step); GitHub caps a reusable
  # workflow's permissions to what the caller grants, so every caller must
  # grant it too or the run fails validation before any job starts.
  actions: write

jobs:
  bump:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/plugin-version-bump.yml
    with:
      plugin-name: agent-sandbox
      plugin-json-paths: dev-sandbox/.claude-plugin/plugin.json dev-sandbox/.codex-plugin/plugin.json
      marketplace-name: agent-sandbox
      tag-prefix: agent-sandbox
    secrets: inherit
