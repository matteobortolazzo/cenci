name: agent-sandbox — Version Bump

on:
  push:
    branches: [main]
    paths: ['dev-sandbox/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/plugin-version-bump.yml
    with:
      plugin-name: agent-sandbox
      plugin-json-paths: dev-sandbox/.claude-plugin/plugin.json dev-sandbox/.codex-plugin/plugin.json
      marketplace-name: agent-sandbox
      tag-prefix: agent-sandbox
    secrets: inherit
