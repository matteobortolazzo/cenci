name: sandbox — Version Bump

on:
  push:
    branches: [main]
    paths: ['sandbox/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/plugin-version-bump.yml
    with:
      plugin-name: cenci-sandbox
      plugin-json-paths: sandbox/.claude-plugin/plugin.json sandbox/.codex-plugin/plugin.json
      marketplace-name: cenci-sandbox
      tag-prefix: sandbox
    secrets: inherit
