name: Feature request
description: Propose a new capability or improvement for agentflow, agentwatch, or agent-sandbox
labels: ["enhancement"]
body:
  - type: dropdown
    id: layer
    attributes:
      label: Affected layer
      description: Which layer would this feature live in?
      options:
        - agentflow (workflow)
        - agentwatch (attention)
        - agent-sandbox (isolation)
        - Repo-wide / tooling
        - Not sure
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem or gap are you trying to solve? Why does it matter?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen? Sketch the behavior, UX, or API if relevant.
    validations:
      required: true
